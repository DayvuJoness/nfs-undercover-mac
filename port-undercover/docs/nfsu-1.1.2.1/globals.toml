# globals.toml - the curated globals the kit's code reads. Every entry the kit
# compiles against must exist; none of these has been identified for this
# game yet, so they are sentinels in the filler after the resource data
# (0x018a1400-0x018a1fff, see game.toml; data_seeds zero them). Sizes are the
# smallest the kit accepts.

[globals.simulation_turn]
addr = 0x018a1f60
size = 4

[globals.command_frame]
addr = 0x018a1f64
size = 4

[globals.entity_base]
addr = 0x018a1f70
size = 4
stride = 4
count = 1
