pad_haptics = { type = "int", default = 2, min = 0, max = 2, choices = "Off|Light|Strong", choices_ru = "Выкл.|Слабо|Сильно", apply = "live", label = "Controller: crashes, smashes and gear changes", label_ru = "Джойстик: удары, разрушения и передачи", group = "controls.pad", help = "Controller rumble for crashes, smashes, gear changes, the race end and menu moves.|While a controller is connected the trackpad stays quiet.|Light — weaker.", help_ru = "Вибрация джойстика при ударах, разрушениях, переключении передач, в конце гонки и в меню.|Пока джойстик подключён, тачпад молчит.|Слабо — слабее." }
