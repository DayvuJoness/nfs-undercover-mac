trackpad_haptics = { type = "int", default = 2, min = 0, max = 2, choices = "Off|Light|Strong", choices_ru = "Выкл.|Слабо|Сильно", apply = "live", label = "Trackpad: crashes, smashes and gear changes", label_ru = "Тачпад: удары, разрушения и передачи", group = "controls.trackpad", help = "The Force Touch trackpad knocks for crashes, smashes, gear changes, the race end and menu moves.|Best felt with a finger on it.|Light — weaker.", help_ru = "Тачпад Force Touch щёлкает при ударах, разрушениях, переключении передач, в конце гонки и в меню.|Лучше всего чувствуется пальцем.|Слабо — слабее." }
