# Undercover's core mod. Bring-up stage: no hooks yet, only the settings the kit and the app's launcher read
# (game.toml [settings] core_mod = "core.nfsu"; tools/setup_kit/launch.c reads render_scale and
# mixer_free from mod-settings.json before the game starts).
# The [settings] lines are written by a table (English and Russian, label_ru/help_ru/choices_ru for the F10 menu).
id = "core.nfsu"
name = "Undercover"
version = "0.1.0"
api = 1
game = "d1ecded04cbba387c99299d2159b29b5c04b1d095293013caa4b404a43c7d2e9"
requires = ["core.hooks >= 1.0.0"]
affects_simulation = false

[plugin]
path = "nfsu.dylib"

[settings]
pause_in_menu = { type = "bool", default = true, apply = "live", label = "Settings menu pauses the game", label_ru = "Меню настроек ставит игру на паузу", group = "career", help = "On — the game stops while F10 is open (race clock, cops and traffic wait).|Off — the game keeps running behind the menu.", help_ru = "Вкл. — пока открыто F10, игра стоит (время заезда, полиция и трафик ждут).|Выкл. — игра идёт дальше за меню." }
ea_nation_signin = { type = "bool", default = false, apply = "live", label = "EA Nation sign-in after loading a save", label_ru = "Вход в EA Nation после загрузки сохранения", group = "career", help = "EA Nation closed long ago: the game only tried to connect and then waited for Enter.|Off — skip that sign-in after a save loads.|On — as in the game.", help_ru = "Сервис EA Nation давно закрыт: игра лишь пыталась подключиться и ждала Enter.|Выкл. — пропускать этот вход после загрузки сохранения.|Вкл. — как в игре." }
startup_logos = { type = "bool", default = true, apply = "restart", label = "Logo movie at start-up", label_ru = "Ролик с логотипами при запуске", group = "career", help = "The EA / Black Box / Need for Speed logo movie (about 9 s) when the game starts.|Off — the title screen comes 9 s sooner.", help_ru = "Ролик с логотипами EA / Black Box / Need for Speed (около 9 с) при запуске.|Выкл. — титульный экран на 9 с раньше." }
hdr_output = { type = "bool", default = false, apply = "restart", label = "HDR", label_ru = "HDR", group = "graphics.hdr", help = "On an HDR screen (MacBook Pro, HDR monitor) the brightest spots of a race — sun, lights, glints — shine brighter than white.|Menus, the HUD and text stay as without HDR.", help_ru = "На HDR-экране (MacBook Pro, HDR-монитор) самые яркие места заезда — солнце, огни, блики — светят ярче белого.|Меню, приборы и надписи — как без HDR." }
hdr_peak = { type = "int", default = 15, min = 5, max = 60, apply = "live", label = "HDR: brightest light (%)", label_ru = "HDR: самый яркий свет (%)", group = "graphics.hdr", help = "How bright the brightest white gets with HDR on.|15 — about three times plain white on a MacBook Pro.|Higher — more dazzling, lower — calmer.", help_ru = "Насколько ярким становится самый яркий белый при HDR.|15 — примерно втрое ярче обычного белого на MacBook Pro.|Больше — ослепительнее, меньше — спокойнее." }
hdr_world = { type = "int", default = 130, min = 100, max = 200, apply = "live", label = "HDR: brightness of the world (%)", label_ru = "HDR: яркость мира (%)", group = "graphics.hdr", help = "With HDR on, how bright the world of a race is shown, so colours keep up with the lifted lights.|100 — as without HDR.", help_ru = "При HDR — насколько ярче показывается мир заезда, чтобы краски не терялись рядом с огнями.|100 — как без HDR." }
upscaling = { type = "bool", default = true, apply = "live", label = "Sharper upscaling (MetalFX)", label_ru = "Чёткое увеличение (MetalFX)", group = "graphics.resolution", help = "When the game draws fewer pixels than the screen has:|On — Apple MetalFX enlarges it with sharp edges and text.|Off — a plain, softer stretch.", help_ru = "Когда игра рисует меньше пикселей, чем у экрана:|Вкл. — MetalFX от Apple увеличивает с чёткими краями и надписями.|Выкл. — обычное, более мягкое растягивание." }
sharpening = { type = "int", default = 0, min = 0, max = 3, choices = "Off (as in the game)|Light|Medium|Strong", choices_ru = "Выкл. (как в игре)|Лёгкая|Средняя|Сильная", apply = "live", label = "Picture sharpening", label_ru = "Резкость картинки", group = "graphics.resolution", help = "Crisper edges and fine detail; smooth areas like the sky stay as they are.|Off — exactly as the game draws.|Light — barely noticeable.|Medium, Strong — clearly crisper.", help_ru = "Чётче края и мелкие детали; ровные места вроде неба не меняются.|Выкл. — ровно как рисует игра.|Лёгкая — почти незаметна.|Средняя, Сильная — заметно чётче." }
motion_blur = { type = "int", default = 0, min = 0, max = 3, choices = "Smooth|As in the game (stepped)|Lighter|Off", choices_ru = "Плавное|Как в игре (ступеньками)|Слабее|Выкл.", apply = "live", label = "Speed blur at the screen edges", label_ru = "Размытие краёв на скорости", group = "graphics.effects", help = "At speed the game blurs the sides of the screen; the centre stays sharp.|Smooth — one even smear.|As in the game — stepped copies.|Lighter — smooth and 40% weaker.|Off — no speed blur.", help_ru = "На скорости игра размывает края экрана; центр остаётся чётким.|Плавное — ровный мазок.|Как в игре — ступенчатые копии.|Слабее — плавное и на 40% слабее.|Выкл. — без размытия." }
colour_filter = { type = "int", default = 0, min = 0, max = 2, choices = "As in the game (yellow-orange)|Softer|Neutral (no tint)", choices_ru = "Как в игре (жёлто-оранжевый)|Мягче|Нейтральный (без оттенка)", apply = "restart", label = "Colour filter", label_ru = "Цветовой фильтр", group = "graphics.light", help = "The game tints the whole picture yellow-orange.|As in the game — the full tint.|Softer — half of it.|Neutral — true colours, a little darker.", help_ru = "Игра окрашивает картинку в жёлто-оранжевый.|Как в игре — полный оттенок.|Мягче — вдвое слабее.|Нейтральный — настоящие цвета, чуть темнее." }
render_scale = { type = "int", default = 2, min = 0, max = 3, choices = "Screen (heaviest)|1.5x (smoother)|Game resolution|Half the screen (cooler)", choices_ru = "Экран (тяжелее всего)|1,5x (ровнее)|Разрешение игры|Половина экрана (прохладнее)", apply = "restart", label = "Render resolution", label_ru = "Разрешение отрисовки", group = "graphics.resolution", help = "How many pixels the game draws:|Screen — the Mac's full Retina resolution (heaviest).|1.5x — smoother edges, about twice the work.|Game resolution — as set in the game.|Half the screen — a quarter of the pixels by MetalFX, much cooler.", help_ru = "Сколько пикселей рисует игра:|Экран — полное Retina-разрешение Mac (тяжелее всего).|1,5x — ровнее края, примерно вдвое больше работы.|Разрешение игры — как выбрано в игре.|Половина экрана — вчетверо меньше пикселей через MetalFX, намного прохладнее." }
menu_fps = { type = "int", default = 0, min = 0, max = 3, choices = "45 (as on the original PC)|30|60|Not limited", choices_ru = "45 (как на ПК)|30|60|Без ограничения", apply = "live", label = "Menu frame rate", label_ru = "Частота кадров в меню", group = "graphics.display", help = "Frames a second in menus, loading screens and the pause menu.|45 — as on the original PC.|30 — saves the most power.|60, Not limited — smoother.|Driving is not affected.", help_ru = "Кадров в секунду в меню, загрузках и паузе.|45 — как на оригинальном ПК.|30 — больше всего экономит батарею.|60, Без ограничения — плавнее.|На езду не влияет." }
depth_of_field = { type = "int", default = 1, min = 0, max = 2, choices = "As in the game|Weaker|Off", choices_ru = "Как в игре|Слабее|Выкл.", apply = "live", label = "Depth of field", label_ru = "Глубина резкости", group = "graphics.effects", help = "The camera blurs what is nearer and farther than its focus (most when it circles a standing car).|As in the game — full blur.|Weaker — half.|Off — everything sharp.", help_ru = "Камера размывает то, что ближе и дальше фокуса (сильнее всего, когда облетает стоящую машину).|Как в игре — полное размытие.|Слабее — вполовину.|Выкл. — всё чёткое." }
notch_area = { type = "bool", default = true, apply = "restart", label = "Picture beside the notch", label_ru = "Картинка рядом с «чёлкой»", group = "graphics.layout", help = "Full screen on a MacBook with a notch:|On — the picture fills the strips beside the notch too (pick the full screen size in the game, e.g. 3024x1964).|Off — below the notch, a black strip at the top.", help_ru = "Полный экран на MacBook с «чёлкой»:|Вкл. — картинка занимает и полосы по бокам «чёлки» (выберите в игре полный размер экрана, например 3024x1964).|Выкл. — ниже «чёлки», с чёрной полосой сверху." }
hud_fill = { type = "bool", default = true, apply = "live", label = "Menus fill the screen's height", label_ru = "Меню на всю высоту экрана", group = "graphics.layout", help = "On a screen narrower than 16:9 (MacBook 16:10):|On — menus, the map and loading screens fill the height, no bands.|Off — the 16:9 layout with bands above and below.", help_ru = "На экране уже 16:9 (MacBook 16:10):|Вкл. — меню, карта и загрузки на всю высоту, без полос.|Выкл. — макет 16:9 с полосами сверху и снизу." }
shadow_softness = { type = "int", default = 2, min = 0, max = 3, choices = "Off (as in the game)|Light|Medium|Strong", choices_ru = "Выкл. (как в игре)|Слабо|Средне|Сильно", apply = "restart", label = "Shadow softness", label_ru = "Мягкость теней", group = "graphics.detail", help = "Soft shadow edges, as in real light: sharp at the object, softer farther away.|Off — the game's hard, stepped shadows.|Light, Medium, Strong — how soft.", help_ru = "Мягкие края теней, как при настоящем свете: чёткие у предмета, мягче вдали.|Выкл. — жёсткие ступенчатые тени игры.|Слабо, Средне, Сильно — насколько мягкие." }
shadow_reflection_detail = { type = "int", default = 0, min = 0, max = 2, choices = "Quality|Balanced|Smoothness", choices_ru = "Качество|Баланс|Плавность", apply = "restart", label = "Shadows and reflections", label_ru = "Тени и отражения", group = "graphics.detail", help = "How finely shadows and road and car reflections are drawn.|Quality — twice the game's size, the sharpest.|Balanced — shadows 1.5x, less heat.|Smoothness — as in the game, the most frames.", help_ru = "Насколько подробно рисуются тени и отражения на дороге и машинах.|Качество — вдвое крупнее, чем в игре, самые чёткие.|Баланс — тени в 1,5 раза, меньше нагрев.|Плавность — как в игре, больше всего кадров." }
smoke_resolution = { type = "int", default = 0, min = 0, max = 2, choices = "Game's quarter|Half|Full", choices_ru = "Четверть, как в игре|Половина|Полное", apply = "restart", label = "Smoke and dust resolution", label_ru = "Разрешение дыма и пыли", group = "graphics.detail", help = "Resolution of smoke, dust and tyre smoke.|Game's quarter — as originally, the coolest.|Half — a good balance.|Full — the sharpest, the graphics chip works much harder.", help_ru = "Разрешение дыма, пыли и дыма от шин.|Четверть, как в игре — как было, меньше всего нагрев.|Половина — хороший баланс.|Полное — чётче всего, но видеочип работает намного больше." }
draw_distance = { type = "int", default = 2, min = 0, max = 2, choices = "As in the game|Farther|Much farther", choices_ru = "Как в игре|Дальше|Гораздо дальше", apply = "live", label = "Draw distance", label_ru = "Дальность прорисовки", group = "graphics.detail", help = "How far shadows and small scenery are drawn.|As in the game — shadows end at about 170 m.|Farther — shadows to 320 m, all scenery layers.|Much farther — shadows to 500 m.", help_ru = "Насколько далеко рисуются тени и мелкие предметы.|Как в игре — тени кончаются примерно в 170 м.|Дальше — тени до 320 м, все слои декораций.|Гораздо дальше — тени до 500 м." }
bloom = { type = "int", default = 1, min = 0, max = 2, choices = "As in the game|Weaker|Off", choices_ru = "Как в игре|Слабее|Выкл.", apply = "live", label = "Glow round bright things", label_ru = "Свечение вокруг ярких мест", group = "graphics.light", help = "The soft glow over bright things: headlights, street lights, the sky over trees.|As in the game — full glow.|Weaker — half.|Off — crisp lights, no halo.", help_ru = "Мягкое свечение вокруг ярких мест: фары, фонари, небо над деревьями.|Как в игре — полное.|Слабее — вполовину.|Выкл. — чёткие огни без ореола." }
gloss = { type = "int", default = 1, min = 0, max = 2, choices = "As in the game|Softer|Matte", choices_ru = "Как в игре|Мягче|Матово", apply = "live", label = "Gloss of roads and buildings", label_ru = "Блеск дорог и зданий", group = "graphics.light", help = "How shiny roads, buildings and the ground are (car paint is always as in the game).|As in the game — the original glare, a dry road may look wet.|Softer — toned down.|Matte — toned down further.", help_ru = "Насколько блестят дороги, здания и земля (краска машин всегда как в игре).|Как в игре — исходные блики, сухая дорога может выглядеть мокрой.|Мягче — блики приглушены.|Матово — ещё слабее." }
mod_redux = { type = "bool", default = true, apply = "live", label = "Need for Speed Undercover Redux", label_ru = "Need for Speed Undercover Redux", group = "visual", help = "The Redux mod: new textures of roads, ground and buildings, and its game parameters (cameras, glow, physics).|Its InGameA.bun is read at the next load.", help_ru = "Мод Redux: новые текстуры дорог, земли и зданий и его параметры игры (камеры, свечение, физика).|Его InGameA.bun читается при следующей загрузке." }
mod_prostreet_sky = { type = "bool", default = true, apply = "live", label = "ProStreet sky", label_ru = "Небо из ProStreet", group = "visual", help = "The ProStreet Sky mod: the sky and clouds of Need for Speed ProStreet.", help_ru = "Мод ProStreet Sky: небо и облака из Need for Speed ProStreet." }
mod_hc_hud = { type = "bool", default = true, apply = "live", label = "High-contrast HUD", label_ru = "Контрастный HUD", group = "visual", help = "The High Contrast HUD mod: a clearer tachometer, map and race icon.|Shows from the next scene load.", help_ru = "Мод High Contrast HUD: более чёткие тахометр, карта и значок гонки.|Видно со следующей загрузки сцены." }
mod_revamped_pursuits = { type = "bool", default = true, apply = "live", label = "Revamped Pursuits", label_ru = "Revamped Pursuits", group = "gameplay", help = "The Revamped Pursuits mod: police cars, their numbers, support and tactics at each heat level reworked.|A pursuit already going keeps part of its start.", help_ru = "Мод Revamped Pursuits: полицейские машины, их число, поддержка и тактика на каждом уровне розыска переработаны.|Уже идущая погоня сохраняет часть начальных значений." }
mod_eo_collectors = { type = "bool", default = true, apply = "live", label = "Collector's Edition", label_ru = "Коллекционное издание", group = "extraoptions.game", help = "The game counts as the Collector's Edition, with its extra cars and events.", help_ru = "Игра считается коллекционным изданием, с его дополнительными машинами и событиями." }
mod_eo_no_tap_reverse = { type = "bool", default = true, apply = "live", label = "No reverse on a double brake tap", label_ru = "Без заднего хода по двойному тормозу", group = "extraoptions.driving", help = "On — a double tap of the brake no longer engages reverse.|Hold the brake to reverse.", help_ru = "Вкл. — двойное нажатие тормоза не включает задний ход.|Для заднего хода держите тормоз." }
mod_eo_unlock_all = { type = "bool", default = false, apply = "live", label = "Everything unlocked", label_ru = "Всё разблокировано", group = "extraoptions.game", help = "Every car, part and event open; the money is kept at the amount below.|Off — your own progress comes back.|Key: 6.", help_ru = "Открыты все машины, детали и события; деньги держатся на сумме ниже.|Выкл. — возвращается ваш прогресс.|Клавиша: 6." }
mod_eo_cash = { type = "int", default = 10000000, min = 0, max = 999999999, step = 1000000, unit = "$", apply = "live", label = "Career money", label_ru = "Деньги в карьере", group = "extraoptions.game", help = "The money you have now.|Click the field (or Return), type the amount, then Apply or Return.|With Everything unlocked the money is topped back up to it.", help_ru = "Сколько денег у вас сейчас.|Щёлкните поле (или Enter), наберите сумму, затем «Применить» или Enter.|При «Всё разблокировано» деньги пополняются до неё." }
mod_eo_autodrive = { type = "bool", default = false, apply = "live", label = "Autopilot", label_ru = "Автопилот", group = "extraoptions.driving", help = "In free roam the game drives the car itself, like its demo driver.|Off when the game starts.|Key: 7.", help_ru = "В свободной езде игра ведёт машину сама, как демо-водитель.|При запуске выключен.|Клавиша: 7." }
mod_eo_heat_hack = { type = "bool", default = false, apply = "live", label = "Choose the heat level", label_ru = "Выбор уровня розыска", group = "extraoptions.police", help = "On — your heat level is the one chosen below.|Off — the game's own.|Key: 8.", help_ru = "Вкл. — уровень розыска — тот, что выбран ниже.|Выкл. — как в игре.|Клавиша: 8." }
mod_eo_heat_level = { type = "int", default = 1, min = 1, max = 5, apply = "live", label = "Heat level", label_ru = "Уровень розыска", group = "extraoptions.police", help = "The heat level used while Choose the heat level is on.|1 — the calmest police, 5 — the toughest.|Key: 9.", help_ru = "Уровень розыска, пока включён «Выбор уровня розыска».|1 — самая спокойная полиция, 5 — самая жёсткая.|Клавиша: 9." }
mod_eo_cops = { type = "bool", default = true, apply = "live", label = "Police in the city", label_ru = "Полиция в городе", group = "extraoptions.police", help = "Off — no police cars and no pursuits.|On — as in the game.|Key: 0.", help_ru = "Выкл. — нет полицейских машин и погонь.|Вкл. — как в игре.|Клавиша: 0." }
mod_eo_lights = { type = "bool", default = false, apply = "live", label = "Emergency lights on your car", label_ru = "Мигалки на вашей машине", group = "extraoptions.police", help = "Flashing emergency lights on the car you drive.|Off when the game starts.|Key: O (a police car's own lights: H).", help_ru = "Проблесковые огни на машине, которой вы управляете.|При запуске выключено.|Клавиша: O (мигалки служебной машины — H)." }
mod_eo_freeze_camera = { type = "bool", default = false, apply = "live", label = "Freeze the camera", label_ru = "Заморозить камеру", group = "extraoptions.driving", help = "The camera stays put while the car drives on — for screenshots.|Off when the game starts.|Key: -.", help_ru = "Камера стоит на месте, а машина едет дальше — для снимков.|При запуске выключено.|Клавиша: -." }
mod_eo_hotkeys = { type = "bool", default = true, apply = "live", label = "Keys for these options", label_ru = "Клавиши для этих функций", group = "extraoptions.driving", help = "While you drive these keys switch the options above:|6 everything unlocked, 7 autopilot|8 choose the heat level, 9 next level|0 police, O lights, - frozen camera", help_ru = "Во время езды эти клавиши переключают функции выше:|6 всё разблокировано, 7 автопилот|8 выбор уровня розыска, 9 следующий уровень|0 полиция, O мигалки, - заморозка камеры" }
mod_police_career = { type = "bool", default = false, apply = "live", label = "Police Career", label_ru = "Полицейская карьера", group = "gameplay", help = "The Police Career mod: play as a police officer in free roam (Police mode in the pause menu).|Own garage and shop, patrols, pursuits, the Interceptor event.|Off ends police mode.", help_ru = "Мод Police Career: игра за полицейского в свободной езде («Режим полицейского» в меню паузы).|Свои гараж и магазин, патрули, погони, событие «Перехват».|Выключение завершает режим полицейского." }
mod_addon_cars = { type = "bool", default = false, apply = "live", label = "Add-on cars", label_ru = "Машины-аддоны", group = "cars", help = "15 extra cars in the car lot: Koenigsegg, Ferrari, Lamborghini, Aston Martin, Mercedes-AMG, Alfa Romeo, Honda, Subaru, Toyota, Lexus.|Two Ladas in a Russia section.|Off hides them from the car lot and garages.", help_ru = "15 новых машин у автодилера: Koenigsegg, Ferrari, Lamborghini, Aston Martin, Mercedes-AMG, Alfa Romeo, Honda, Subaru, Toyota, Lexus.|Две Лады — в разделе «Россия».|Выкл. прячет их из автосалона и гаражей." }
mod_hard_drivers = { type = "int", default = 0, min = 0, max = 3, choices = "Off|Easy|Normal|Hard", choices_ru = "Выкл.|Лёгкая|Средняя|Сложная", apply = "live", label = "Racer difficulty (Hard Drivers)", label_ru = "Сложность соперников (Hard Drivers)", group = "gameplay", help = "The Hard Drivers mod: racers with more skill and speed.|Off — the game's racers.|Easy — a little harder.|Normal — between.|Hard — the mod's level: they stay on your tail.", help_ru = "Мод Hard Drivers: соперники опытнее и быстрее.|Выкл. — соперники игры.|Лёгкая — чуть сложнее.|Средняя — между ними.|Сложная — уровень мода: держатся у вас на хвосте." }
mod_porsche_pack = { type = "bool", default = false, apply = "live", label = "Porsche Pack cars", label_ru = "Автомобили Porsche Pack", group = "cars", help = "26 Porsches of the Porsche Pack (959, 918, many 911s, Boxsters) in the car lot.|Off hides them from the car lot and garages.", help_ru = "26 машин Porsche Pack (959, 918, разные 911, Boxster) у автодилера.|Выкл. прячет их из автосалона и гаражей." }
